services:
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  panel:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      cache:
        condition: service_healthy
    expose:
      - "80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_ENVIRONMENT_ONLY: "true"
      APP_URL: "${APP_URL:?APP_URL must be set}"
      APP_KEY: "${APP_KEY:?APP_KEY must be set}"
      APP_THEME: "${APP_THEME:-pterodactyl}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Asia/Bangkok}"
      APP_LOCALE: "${APP_LOCALE:-en}"
      APP_SERVICE_AUTHOR: "${APP_SERVICE_AUTHOR:-noreply@example.com}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-*}"

      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:?DB_HOST must be set}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:?DB_DATABASE must be set}"
      DB_USERNAME: "${DB_USERNAME:?DB_USERNAME must be set}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"

      REDIS_HOST: cache
      REDIS_PORT: "6379"
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis

      HASHIDS_SALT: "${HASHIDS_SALT:?HASHIDS_SALT must be set}"
      HASHIDS_LENGTH: "${HASHIDS_LENGTH:-8}"

      MAIL_MAILER: "${MAIL_MAILER:-smtp}"
      MAIL_HOST: "${MAIL_HOST:-smtp.example.com}"
      MAIL_PORT: "${MAIL_PORT:-25}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_ENCRYPTION: "${MAIL_ENCRYPTION:-tls}"
      MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@example.com}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-Beacon Panel}"

      BEACON_SELF_SERVICE_ENABLED: "${BEACON_SELF_SERVICE_ENABLED:-false}"
      BEACON_MINECRAFT_VERSIONS: "${BEACON_MINECRAFT_VERSIONS:-1.21.8,1.21.4,1.20.4,1.20.1}"
      BEACON_API_RATELIMIT: "${BEACON_API_RATELIMIT:-60}"
      BEACON_API_RATELIMIT_PERIOD: "${BEACON_API_RATELIMIT_PERIOD:-1}"
      BEACON_CONTENT_RATELIMIT: "${BEACON_CONTENT_RATELIMIT:-20}"
      BEACON_CONTENT_RATELIMIT_PERIOD: "${BEACON_CONTENT_RATELIMIT_PERIOD:-1}"
      BEACON_POLL_RATELIMIT: "${BEACON_POLL_RATELIMIT:-120}"
      BEACON_POLL_RATELIMIT_PERIOD: "${BEACON_POLL_RATELIMIT_PERIOD:-1}"
      BEACON_MODRINTH_USER_AGENT: "${BEACON_MODRINTH_USER_AGENT:-PuShitcake/BeaconPanel}"
      BEACON_MODRINTH_TIMEOUT: "${BEACON_MODRINTH_TIMEOUT:-10}"
      BEACON_MODRINTH_CACHE_TTL: "${BEACON_MODRINTH_CACHE_TTL:-300}"
      BEACON_CONTENT_MAX_FILE_BYTES: "${BEACON_CONTENT_MAX_FILE_BYTES:-268435456}"
      BEACON_CONTENT_MAX_TOTAL_BYTES: "${BEACON_CONTENT_MAX_TOTAL_BYTES:-536870912}"
      BEACON_CONTENT_MAX_DEPENDENCIES: "${BEACON_CONTENT_MAX_DEPENDENCIES:-50}"
      BEACON_CONTENT_MAX_DEPENDENCY_DEPTH: "${BEACON_CONTENT_MAX_DEPENDENCY_DEPTH:-8}"
      BEACON_CONTENT_REQUIRE_STOPPED_SERVER: "${BEACON_CONTENT_REQUIRE_STOPPED_SERVER:-true}"
      BEACON_CONTENT_BACKUP_BEFORE_MUTATION: "${BEACON_CONTENT_BACKUP_BEFORE_MUTATION:-true}"
      BEACON_MOD_INSTALLER_ENABLED: "${BEACON_MOD_INSTALLER_ENABLED:-true}"
      BEACON_MOD_POWER_TIMEOUT: "${BEACON_MOD_POWER_TIMEOUT:-120}"
      BEACON_MINECRAFT_SERVICES_ENABLED: "${BEACON_MINECRAFT_SERVICES_ENABLED:-true}"
      BEACON_MINECRAFT_SERVICES_POWER_TIMEOUT: "${BEACON_MINECRAFT_SERVICES_POWER_TIMEOUT:-120}"
      BEACON_MINECRAFT_SERVICES_PORT_RANGE_START: "${BEACON_MINECRAFT_SERVICES_PORT_RANGE_START:-25570}"
      BEACON_MINECRAFT_SERVICES_PORT_RANGE_END: "${BEACON_MINECRAFT_SERVICES_PORT_RANGE_END:-25670}"
      BEACON_CONFIG_REQUIRE_STOPPED_SERVER: "${BEACON_CONFIG_REQUIRE_STOPPED_SERVER:-true}"
      BEACON_MODPACKS_ENABLED: "${BEACON_MODPACKS_ENABLED:-false}"
      BEACON_MODPACK_MAX_ARCHIVE_BYTES: "${BEACON_MODPACK_MAX_ARCHIVE_BYTES:-2147483648}"
      BEACON_MODPACK_MAX_EXTRACTED_BYTES: "${BEACON_MODPACK_MAX_EXTRACTED_BYTES:-8589934592}"
      BEACON_MODPACK_OPERATION_TIMEOUT: "${BEACON_MODPACK_OPERATION_TIMEOUT:-60}"
      BEACON_MODPACK_POWER_TIMEOUT: "${BEACON_MODPACK_POWER_TIMEOUT:-120}"
      BEACON_CURSEFORGE_API_KEY: "${BEACON_CURSEFORGE_API_KEY:-}"
      BEACON_TECHNIC_BUILD: "${BEACON_TECHNIC_BUILD:-multimc}"
      BEACON_VOIDSWRATH_ENABLED: "${BEACON_VOIDSWRATH_ENABLED:-false}"
      BEACON_EGG_VANILLA: "${BEACON_EGG_VANILLA:-Vanilla Minecraft}"
      BEACON_EGG_PAPER: "${BEACON_EGG_PAPER:-Paper}"
      BEACON_EGG_FABRIC: "${BEACON_EGG_FABRIC:-Vanilla Minecraft}"
      BEACON_EGG_FORGE: "${BEACON_EGG_FORGE:-Forge Minecraft}"
      BEACON_EGG_NEOFORGE: "${BEACON_EGG_NEOFORGE:-Forge Minecraft}"
      BEACON_EGG_QUILT: "${BEACON_EGG_QUILT:-Vanilla Minecraft}"
    volumes:
      - panel_var:/app/var
      - panel_logs:/app/storage/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

volumes:
  panel_var:
  panel_logs:
